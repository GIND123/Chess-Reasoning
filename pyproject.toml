[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessr"
version = "0.1.0"
description = "Process-verified chess reasoning: deterministic claim verification as a training signal"
requires-python = ">=3.10"
dependencies = ["chess>=1.11.2", "numpy", "pandas", "pyyaml", "tqdm"]

[project.optional-dependencies]
train = ["torch", "transformers>=4.57", "trl>=0.26", "peft", "accelerate", "datasets", "vllm>=0.11"]
dev   = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
