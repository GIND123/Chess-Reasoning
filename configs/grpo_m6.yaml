# M6 - ours. Process-verified GRPO: graded move quality + claim grounding.
model: /runs/sft_merged
out_dir: /runs/grpo_m6
tables: /data/tables_pv
train_jsonl: /data/rl_positions.jsonl
terms:   [move, precision, coverage, format, penalty]
weights: [1.0,  0.5,       0.3,      0.2,    1.0]
sparse_move: false
steps: 400
num_generations: 8
per_device_bs: 8
grad_accum: 2
lr: 1.0e-6
max_completion_length: 400
loss_type: dapo
beta: 0.0
epsilon_high: 0.28
seed: 0
gradient_checkpointing: true
vllm_gpu_memory_utilization: 0.28
