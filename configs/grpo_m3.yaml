# M3 - dense action-value RLVR (Wang et al. 2507.00726). Graded move reward only.
model: runs/sft
out_dir: runs/grpo_m3
tables: data/final/tables.jsonl
train_jsonl: data/final/rl_positions.jsonl
terms:   [move, format, penalty]
weights: [1.0,  0.2,    1.0]
sparse_move: false
steps: 400
num_generations: 8
per_device_bs: 24
lr: 1.0e-6
max_completion_length: 400
loss_type: dapo
beta: 0.0
seed: 0
