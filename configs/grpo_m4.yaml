# M4 - sparse outcome RLVR (DeepSeek-R1 style). Binary correct/incorrect.
model: /runs/sft_merged
out_dir: /runs/grpo_m4
tables: /data/tables_pv
train_jsonl: /data/rl_positions.jsonl
terms:   [move, format, penalty]
weights: [1.0,  0.2,    1.0]
sparse_move: true
steps: 400
num_generations: 8
per_device_bs: 8
grad_accum: 2
lr: 1.0e-6
max_completion_length: 400
loss_type: dapo
beta: 0.0
seed: 0
gradient_checkpointing: true
vllm_gpu_memory_utilization: 0.28
